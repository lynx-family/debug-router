[git]
conventional_commits = false
filter_commits = true
tag_pattern = ".*-harmony$"
commit_parsers = [
  { message = ".*changelog: no.*", skip = true },
  { message = "(?i).*(harmony|\\bhar\\b).*", group = "Harmony" },
  { message = ".*", group = "Changes" }
]

[changelog]
header = """
## <!-- version -->
"""

body = """
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first }} ([{{ commit.id | truncate(length=7, end="") }}](REPO_URL/commit/{{ commit.id }}))
{% endfor %}
"""
