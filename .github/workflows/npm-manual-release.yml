name: npm release

on:
  push:
    tags:
      - "*-connector"

permissions:
  contents: write
  id-token: write

jobs:
  npm-release-test:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 7.33.6

      # Update npm to the latest version to enable OIDC
      - name: Update npm
        run: |
          npm --version

      - name: Build debug-router-connector
        run: |-
          set -e
          pushd debug_router_connector/

          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [[ $TAG_NAME == *"-connector"* ]]; then
            version=${TAG_NAME%-connector}
            echo "debug-router-connector version: $version"
            npm version --no-git-tag-version $version
          fi

          npm install
          npm run build
          npm test
          PACK_JSON=$(npm pack --dry-run --json)
          node -e 'const files=JSON.parse(process.argv[1])[0].files.map(f=>f.path); for (const required of ["dist/cjs/src/cli/bin.js", "skills/debug-router/SKILL.md"]) { if (!files.includes(required)) throw new Error(`Missing ${required}`); }' "$PACK_JSON"
          ls -al

          if [[ $version == *"alpha"* ]]; then
              echo "Publishing alpha version..."
              npm publish --tag alpha
          else
              echo "Publishing stable version..."
              npm publish
          fi

          popd
