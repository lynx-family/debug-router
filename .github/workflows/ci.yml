name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Step budgets use successful CI runs from 2026-10-12 through 2026-10-20
# with matching job definitions. Add the greater of 50% of the maximum
# duration or two minutes, then round up to whole minutes.
jobs:
  static-check:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - name: Python Setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}
          path: ${{ github.workspace }}
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run file type check
        timeout-minutes: 3
        run: |
          source tools/envsetup.sh
          python3 tools_shared/git_lynx.py check --checkers file-type
      - name: Run java-lint check
        timeout-minutes: 3
        run: |
          source tools/envsetup.sh
          python3 tools_shared/git_lynx.py check --checkers java-lint
      - name: Run android-check-style check
        timeout-minutes: 3
        run: |
          source tools/envsetup.sh
          python3 tools_shared/git_lynx.py check --checkers android-check-style
      - name: Run commit-message check
        timeout-minutes: 3
        run: |
          source tools/envsetup.sh
          python3 tools_shared/git_lynx.py check --checkers commit-message
      - name: Run coding-style check
        timeout-minutes: 3
        run: |
          cd tools_shared
          ./hab sync -f .
          source envsetup.sh
          cd ..
          source tools/envsetup.sh
          git lynx check --checkers coding-style

  unittest-build-check:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - name: Python Setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run Unittests
        timeout-minutes: 3
        run: |
          set -e
          source tools/envsetup.sh
          python3 test/unit_test/check_test_build.py
          python3 test/unit_test/check_test_run.py

  android-aar-build:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python Setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 7.33.6
      - name: Grant execute permission for gradlew
        run: cd $GITHUB_WORKSPACE/test/e2e_test/android_example &&  chmod +x ./gradlew
      - name: Build the AAR
        timeout-minutes: 9
        run: |-
          source tools/envsetup.sh
          pushd test/e2e_test/android_example
          ./gradlew :DebugRouter:assemblerelease
          popd

  android-websocket-connection-ci-check:
    runs-on: lynx-ubuntu-22.04-physical-medium
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python Setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 7.33.6
      - name: Grant execute permission for gradlew
        run: cd $GITHUB_WORKSPACE/test/e2e_test/android_example &&  chmod +x ./gradlew
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run the android websocket connection check
        timeout-minutes: 8
        run: |-
          source tools/envsetup.sh
          python3 test/connect_test/check_android_connection_ci.py -t websocket
      - name: Run multiplexer Android WiFi E2E tests
        timeout-minutes: 3
        run: |-
          source tools/envsetup.sh
          cd test/e2e_test/connector_test
          npm run test:multiplexer:with-device:wifi:android

  android-usb-connection-ci-check:
    runs-on: lynx-ubuntu-22.04-physical-medium
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python Setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 7.33.6
      - name: Grant execute permission for gradlew
        run: cd $GITHUB_WORKSPACE/test/e2e_test/android_example &&  chmod +x ./gradlew
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run the android usb connection check
        timeout-minutes: 6
        run: |-
          source tools/envsetup.sh
          python3 test/connect_test/check_android_connection_ci.py -t usb
      - name: Run multiplexer Android USB E2E tests
        timeout-minutes: 3
        run: |-
          source tools/envsetup.sh
          cd test/e2e_test/connector_test
          npm run test:multiplexer:with-device:android -- --require-message-roundtrip

  android-unittest-check:
    runs-on: lynx-ubuntu-22.04-physical-medium
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python Setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 7.33.6
      - name: Grant execute permission for gradlew
        run: cd $GITHUB_WORKSPACE/test/e2e_test/android_example &&  chmod +x ./gradlew
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run the android unittests check
        timeout-minutes: 7
        run: |-
          source tools/envsetup.sh
          python3 test/unit_test/check_android_unittest.py

  ios-debugrouter-lib-build:
    runs-on: lynx-darwin-14-medium
    env:
      POD_VERSION: 5.0.5
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 7.33.6
      - name: Build Example App
        timeout-minutes: 4
        run: |-
          set -e
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          pushd test/e2e_test/ios_example
          root_dir=$(pwd) && SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk bundle install
          bundle exec pod install --verbose --repo-update
          xcodebuild clean -workspace DebugRouter.xcworkspace -scheme DebugRouter -configuration Debug
          xcodebuild -workspace DebugRouter.xcworkspace -scheme DebugRouter -configuration Debug -arch arm64 -derivedDataPath iOSCoreBuild/DerivedData -sdk iphonesimulator
          popd

  ios-unittest-check:
    runs-on: lynx-darwin-14-medium
    env:
      POD_VERSION: 5.0.5
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 7.33.6
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Run the ios unittests check
        timeout-minutes: 12
        run: |-
          source tools/envsetup.sh
          set -e
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          pushd test/e2e_test/ios_example
          root_dir=$(pwd) && SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk bundle install
          bundle exec pod install --verbose --repo-update
          xcodebuild clean -workspace DebugRouter.xcworkspace -scheme DebugRouter -configuration Debug
          xcodebuild -showsdks | grep -Eo -m 1 "iphonesimulator([0-9]{1,}\.)+[0-9]{1,}" > sdk.txt
          sdkVersion=$(awk '{ sub(/iphonesimulator/,""); print $0 }' sdk.txt)
          echo $sdkVersion > sdk.txt
          xcodebuild build-for-testing ARCHS=arm64 -workspace DebugRouter.xcworkspace -scheme DebugRouter_Tests -enableCodeCoverage YES -configuration Debug -sdk iphonesimulator$(cat sdk.txt) COMPILER_INDEX_STORE_ENABLE=NO -derivedDataPath iOSCoreBuild/DerivedData -dest"platform=iOS Simulator,OS=$(cat sdk.txt),name=iPhone 11" SYMROOT=`pwd`/Build/Products
          chmod u+x xctestrunner
          ./xctestrunner --xctestrun `pwd`/Build/Products/DebugRouter_Tests_iphonesimulator$(cat sdk.txt)-arm64.xctestrun --work_dir `pwd` --output_dir `pwd`/iOSCoreBuild/DerivedData simulator_test
          popd

  harmony-har-build:
    runs-on: lynx-custom-container
    container:
      image: ghcr.io/lynx-family/ubuntu24.04-harmony@sha256:bf493c3710de3c44bfa84caf402c0727b9310c42497f6e52580ad441ea640ef1
      credentials:
        username: lynx-family
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Build har
        timeout-minutes: 3
        shell: bash
        run: |
          PROJECT_ROOT=$(pwd)
          source tools/envsetup.sh
          pushd test/e2e_test/harmony_example
          ohpm install
          ./script/build.py --build_har --modules debug_router --verbose
          popd
          pushd debug_router/harmony/debug_router/build/default/outputs/default
          ls -al
          popd

  harmony-hap-build:
    runs-on: lynx-custom-container
    container:
      image: ghcr.io/lynx-family/ubuntu24.04-harmony@sha256:bf493c3710de3c44bfa84caf402c0727b9310c42497f6e52580ad441ea640ef1
      credentials:
        username: lynx-family
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Common Dependencies
        uses: ./.github/actions/common-deps
      - name: Build hap
        timeout-minutes: 3
        shell: bash
        run: |
          PROJECT_ROOT=$(pwd)
          source tools/envsetup.sh
          pushd test/e2e_test/harmony_example
          ohpm install
          ./script/build.py --build_hap --is_debug --modules debug_router --verbose
          popd
          pushd test/e2e_test/harmony_example/entry/build/default/outputs/default
          ls -al
          popd

  multiplexer-unit-tests:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
      - name: Install debug-router-connector dependencies
        working-directory: debug_router_connector
        run: npm ci
      - name: Run multiplexer unit tests
        timeout-minutes: 3
        working-directory: debug_router_connector
        run: npm run test:multiplexer
      - name: Run multiplexer integration tests
        timeout-minutes: 4
        working-directory: debug_router_connector
        run: npm run test:integration:multiplexer
      - name: Install connector E2E dependencies
        working-directory: test/e2e_test/connector_test
        run: npm ci
      # Real-device stress suites are manual-only; Android E2E runs in the device jobs.
      - name: Run multiplexer E2E tests without devices
        timeout-minutes: 3
        working-directory: test/e2e_test/connector_test
        run: npm run test:multiplexer:without-device

  debug-router-connector-npm-package-build:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 7.33.6
      - name: Build debug-router-connector
        timeout-minutes: 3
        run: |-
          set -e
          pushd debug_router_connector/
          npm install
          npm run build
          ls -al
          popd

  remote-debug-driver-npm-package-build:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 7.33.6
      - name: Build remote_debug_driver
        timeout-minutes: 3
        run: |-
          set -e
          pushd remote_debug_driver/
          npm install
          npm run build
          ls -al
          popd
